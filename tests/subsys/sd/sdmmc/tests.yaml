common:
  depends_on: sdhc
  tags:
    - drivers
    - sdhc
tests:
  sd.sdmmc:
    harness: ztest
    harness_config:
      fixture: fixture_sdhc
    filter: dt_compat_enabled("zephyr,sdmmc-disk")
    tags: sdhc
    min_ram: 32
    integration_platforms:
      - mimxrt1064_evk
  drivers.sdhc.sdhc_spi:
    depends_on: spi
    harness: ztest
    harness_config:
      fixture: fixture_sdhc
    filter: dt_alias_exists("sdhc0") and dt_compat_enabled("zephyr,sdhc-spi-slot")
    extra_args:
      - DTC_OVERLAY_FILE="boards/${BOARD}_sdhc_spi.overlay"
    tags: sdhc
    platform_allow:
      - pic32ck_gc01_cult
      - pic32ck_sg01_cult
      - sam_e54_xpro
